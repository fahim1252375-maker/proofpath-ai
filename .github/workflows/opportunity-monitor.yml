name: Opportunity monitoring

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofpath-opportunity-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check opportunity pages and deadlines
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run scheduled monitoring when configured
        env:
          MONITORING_CRON_SECRET: ${{ secrets.MONITORING_CRON_SECRET }}
          MONITOR_URL: https://proofpath-ai-demo.onrender.com
        shell: bash
        run: |
          if [ -z "$MONITORING_CRON_SECRET" ] || [ "${#MONITORING_CRON_SECRET}" -lt 32 ]; then
            echo "::warning::Monitoring skipped. Configure MONITORING_CRON_SECRET in GitHub Actions and the matching Render service environment."
            exit 0
          fi

          curl --silent --show-error --fail-with-body \
            --max-time 210 \
            --request POST "$MONITOR_URL/api/internal/monitoring/run" \
            --header "Authorization: Bearer $MONITORING_CRON_SECRET" \
            --header "Accept: application/json"
